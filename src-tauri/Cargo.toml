[package]
name = "stardew-mod-tool"
version = "0.3.0"
description = "Stardew Valley Easy Mod Creator Tool"
edition = "2021"

[lib]
name = "stardew_mod_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
